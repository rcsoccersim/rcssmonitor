name: AppImage

# A trial of option A of D10 (docs/PLAN_3D-VIEW.md §2.4): build the AppImage
# with CMake and linuxdeploy on Ubuntu 22.04, and check that it starts on
# Ubuntu 22.04, 24.04 and 26.04. During the trial it runs on pushes to
# feature/ci (a workflow_dispatch workflow cannot be run until the file is
# on the default branch). If the option is adopted, it becomes release.yml
# and runs on release tags and by hand.
on:
  push:
    branches: ['feature/ci']

permissions:
  contents: read

env:
  # Pinned releases of linuxdeploy and its Qt plugin.
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_PLUGIN_QT_VERSION: 1-alpha-20250213-1

defaults:
  run:
    # The jobs run in containers; use bash there as well (with pipefail).
    shell: bash

jobs:
  build:
    name: Build the AppImage
    runs-on: ubuntu-26.04
    # An AppImage does not run on a glibc older than the one it is built
    # with, so build it on the oldest base. Its Qt (5.15.3) is also the
    # lowest Qt5 that the plan supports (D2).
    container: ubuntu:22.04
    steps:
      - name: Install the packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file qtbase5-dev zlib1g-dev
      - uses: actions/checkout@v5
      - name: Build and install into AppDir
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build
      - name: Bundle with linuxdeploy
        env:
          # No FUSE in the container: the AppImages extract themselves.
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt5/bin/qmake
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            "$base/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            "$base/linuxdeploy-plugin-qt/releases/download/$LINUXDEPLOY_PLUGIN_QT_VERSION/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          version=$(sed -n 's/^project(rcssmonitor VERSION \([0-9.]*\))/\1/p' CMakeLists.txt)
          export LINUXDEPLOY_OUTPUT_VERSION="$version-${GITHUB_SHA::7}"
          # librcssrcg is installed in AppDir/usr/lib, and the installed
          # rcssmonitor has no rpath to it.
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib"
          # The desktop entry and the icon are in AppDir already
          # (cmake --install), and linuxdeploy picks them up.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls -l rcssmonitor-*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: rcssmonitor-appimage
          path: rcssmonitor-*.AppImage

  run:
    name: Start on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-26.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    steps:
      - name: Install a desktop's libraries and a virtual display
        # linuxdeploy leaves out the libraries that every desktop has
        # (libGL, fontconfig, libxcb, ...), so install them here.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libegl1 libfontconfig1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - uses: actions/download-artifact@v8
        with:
          name: rcssmonitor-appimage
      - name: Start it
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        # --version exits after QApplication has loaded the xcb platform
        # plugin, so this checks the bundled libraries and plugins.
        run: |
          chmod +x rcssmonitor-*.AppImage
          xvfb-run -a ./rcssmonitor-*.AppImage --version | tee version.txt
          grep -q '^rcssmonitor [0-9]' version.txt
